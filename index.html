<style>
:root{
  --bg:#0f1216;--panel:#171c22;--panel2:#1f262e;--line:#34404c;--txt:#eef2f6;--mut:#aebbc8;
  --acc:#2fd38a;--acc2:#1fa36a;--warn:#f5a524;--bad:#ef5b5b;--blue:#4ea1ff;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main,#md{zoom:var(--z,1)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.logo{width:34px;height:34px;border-radius:9px;flex:none}
#hdrTimer{display:none;background:var(--warn);color:#2a1a00;border:0;border-radius:99px;padding:5px 12px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;font-family:inherit;cursor:pointer}
#hdrTimer.show{display:inline-block}
#upd{display:none;position:fixed;top:60px;left:12px;right:12px;z-index:25;background:var(--blue);color:#001b33;border-radius:12px;padding:10px 14px;font-weight:700;align-items:center;gap:8px}
#upd.show{display:flex}
.today{border:2px solid var(--acc2);background:linear-gradient(180deg,#14241d,var(--panel))}
.today h2{margin:0 0 4px}
.steps{margin:6px 0 0;padding-inline-start:22px;line-height:1.7}
.timer.cardio{border-color:var(--blue)}.timer.cardio .bar>div{background:var(--blue)}
.markbig{width:100%;margin:6px 0 10px;padding:14px;font-size:18px;font-weight:800}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(72px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(15,18,22,.95);backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdrTimer.show~#sync{display:none}
#sync{font-size:12px;color:var(--mut);background:none;border:0;font-family:inherit;padding:6px 4px}
#sync[data-a]{cursor:pointer;color:var(--blue);text-decoration:underline}
main{max-width:760px;margin:0 auto;padding:12px 12px 80px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:14px;font-family:inherit;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:22px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:0}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:16px;min-height:44px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#05231a;font-weight:700}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px;min-height:44px;min-width:44px}
.calhead .btn{min-width:48px;min-height:48px;font-size:20px}
.edit{background:none;border:0;color:var(--mut);font-size:16px;min-width:44px;min-height:44px;cursor:pointer}
.rpe{display:flex;align-items:center;gap:8px;margin:2px 0 4px;font-size:14px;color:var(--mut)}.rpe select{width:auto;min-height:44px}
.remind{border:2px solid var(--warn);background:#2b2410}
.music{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#04210f;background:#1db954;border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.big{width:100%;padding:15px;font-size:18px}
.ico{background:none;border:0;color:var(--txt);font-size:20px;cursor:pointer;padding:4px 8px;min-width:44px;min-height:44px}
input,select,textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.pill.g{color:var(--acc);border-color:var(--acc2)}
.pill.o{color:var(--warn);border-color:#8a6418}
.ex{border-top:1px solid var(--line);padding:10px 0}
.ex:first-of-type{border-top:0}
/* calendar */
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.calhead .t{flex:1;text-align:center;font-weight:700;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.cal .d{aspect-ratio:1/1;border-radius:10px;background:var(--panel2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:15px;position:relative;color:var(--txt);padding:0;font-family:inherit}
.cal .d.empty{background:none;cursor:default}
.cal .d.today{border-color:var(--blue)}
.cal .d.plan{background:#17324f}
.cal .d.done{background:#124a33}
.cal .d.part{background:#4a3a12}
.cal .d .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:3px}
.cal .d.done .dot{background:var(--acc)}.cal .d.part .dot{background:var(--warn)}
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--panel2);border-radius:10px;padding:6px;cursor:pointer;border:1px solid transparent;color:var(--txt);font-family:inherit}
.mini .mt{font-size:13px;font-weight:700;margin-bottom:4px;text-align:center}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini .md{height:9px;border-radius:2px;background:#26303a}
.mini .md.x{background:none}.mini .md.plan{background:var(--blue)}.mini .md.done{background:var(--acc)}.mini .md.part{background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
/* workout */
.wi{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.wi.cur{border-color:var(--acc);background:#14241d}
.wi.lock{opacity:.55}
.wi.done{border-color:var(--bad);background:#2b1517}
.wi.done>.row b{color:#ff8a8a}
.wi.skip{border-color:var(--warn);background:#2b2410}
.wi.skip>.row b{color:#ffc766}
.wi.done.wasskip{border-color:var(--acc);background:#11291e}
.wi.done.wasskip>.row b{color:#7ee8b2}
.pill.k{color:#2a1a00;background:var(--warn);border-color:var(--warn)}
.pill.gg{color:#04210f;background:var(--acc);border-color:var(--acc)}
.go{margin-top:8px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart .hit{cursor:pointer}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:4px 0 2px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.tip{min-height:20px;font-size:13px;color:var(--txt);margin-top:2px}
details.tbl summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
.dur{font-variant-numeric:tabular-nums;font-weight:800}
.pill.r{color:#fff;background:var(--bad);border-color:var(--bad)}
.done-txt{color:var(--bad)!important;font-weight:600}
.sets{margin-top:8px}
.set{display:grid;grid-template-columns:52px 1fr 1fr 96px;gap:6px;align-items:center;margin-bottom:6px}
.set input{padding:7px;font-size:15px;text-align:center}
.set .n{font-size:13px;color:var(--mut)}
.set .st{text-align:center;font-size:13px}
.timer{text-align:center;padding:14px 0}
.timer .tt{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer .tl{color:var(--mut);font-size:14px}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--warn);transition:width .25s linear}
.bar.g>div{background:var(--acc)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel2);border-radius:12px;padding:10px}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
.hb{display:grid;grid-template-columns:58px 1fr minmax(54px,auto);gap:6px;align-items:center;font-size:13px;margin:4px 0}
.hb .b{height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
.hb .b>div{height:100%;background:var(--acc);border-radius:4px}
.hb .v{text-align:left;font-variant-numeric:tabular-nums;color:var(--mut)}
/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
#md{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:700px){#ov{align-items:center}#md{border-radius:18px}}
.mh{display:flex;align-items:center;margin-bottom:6px}.mh h2{flex:1;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1}
.li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.li .nm{flex:1;font-size:15px}
#undo{position:fixed;bottom:84px;left:12px;right:12px;z-index:29;display:none;align-items:center;gap:10px;background:#26303a;border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:8px 10px 8px 14px;max-width:520px;margin:0 auto}
#undo.show{display:flex}#undo .btn{background:var(--warn);color:#2a1a00;border-color:var(--warn);font-weight:800}
.last{font-size:14px;color:var(--mut);margin-top:4px}
.sug{margin-top:8px;padding:8px 10px;border-radius:10px;background:#122a3d;border:1px solid var(--blue);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#toast{pointer-events:none;position:fixed;bottom:146px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;display:none}
.empty-msg{text-align:center;color:var(--mut);padding:20px 8px}
</style>
</head>

<script>
'use strict';
(function(){
/* ============ constants & helpers ============ */
const GROUPS=[['chest','חזה'],['shoulders','כתפיים'],['arms','זרועות'],['back','גב'],['legs','רגליים'],['abs','בטן'],['cardio','סיבולת לב ריאה']];
const GK=GROUPS.map(g=>g[0]);
const GN=Object.fromEntries(GROUPS);
const MAX_PER_GROUP=5, MAX_PLAN_ITEMS=35, MAX_PROGRAMS=30;
const DATE_RE=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
const ID_RE=/^[a-z0-9]{6,32}$/;
const LS_KEY='gymapp.v1';
const APP_VERSION='1.5.0';
const SPOTIFY_RE=/^https:\/\/open\.spotify\.com\/(intl-[a-z]{2}\/)?(playlist|album|artist|track|show|episode|collection)(\/[A-Za-z0-9]{1,64}){0,2}\/?(\?[A-Za-z0-9=&_.-]{0,120})?$/;
const BODY_F=[['w','משקל','ק״ג',20,300,1],['bf','אחוז שומן','%',2,70,1],['waist','היקף מותניים','ס״מ',30,250,1],['chest','היקף חזה','ס״מ',40,250,1],['arm','היקף זרוע','ס״מ',10,80,1],['thigh','היקף ירך','ס״מ',20,120,1]];
function sanBody(a){
  const out=new Map();
  for(const e of Array.isArray(a)?a:[]){if(!e||typeof e!=='object'||typeof e.d!=='string'||!DATE_RE.test(e.d))continue;
    const r={d:e.d};let any=false;for(const [f,,,lo,hi] of BODY_F){const v=Number(e[f]);if(Number.isFinite(v)&&v>=lo&&v<=hi){r[f]=Math.round(v*10)/10;any=true;}}
    if(any)out.set(e.d,r);}
  return [...out.values()].sort((x,y)=>x.d<y.d?-1:1).slice(-1000);
}
const GCID_RE=/^[0-9]{6,20}-[a-z0-9]{16,64}\.apps\.googleusercontent\.com$/;
const $=s=>document.querySelector(s);
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"'`]/g,c=>ESC_MAP[c]);
const num=(v,min,max,def)=>{v=Number(v);return Number.isFinite(v)?Math.min(max,Math.max(min,v)):def;};
const int=(v,min,max,def)=>Math.round(num(v,min,max,def));
const str=(v,max)=>typeof v==='string'?v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').slice(0,max):'';
const newId=()=>{const a=new Uint8Array(10);crypto.getRandomValues(a);return Array.from(a,b=>(b%36).toString(36)).join('');};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pkey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const todayKey=()=>dkey(new Date());
const fmtLong=k=>new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(pkey(k));
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const WD=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const mmss=s=>{s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60);};
const fmtN=(n,d=0)=>Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:d});
const isCardio=g=>g==='cardio';
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);

/* ============ state & sanitizing (all external data passes here) ============ */
function defState(){return {v:1,exercises:[],programs:[],plans:{},logs:{},body:[],settings:{exRest:600,allowSkip:false,sound:true,vol:100,zoom:100,age:0,voice:true,spotify:'',lastBackup:0,backupSnooze:0,gcid:'',gconn:false},active:null,updatedAt:0};}
function sanEx(e){
  if(!e||typeof e!=='object'||!ID_RE.test(e.id)||!GK.includes(e.group))return null;

    rest:int(e.rest,0,1800,90),machine:str(e.machine,20),notes:str(e.notes,300),km:num(e.km,0,500,0),min:int(e.min,0,600,0),...sanCardio(e)};

/* cardio extras: kind walk/run, incline %, intervals (run only) */
function sanCardio(e){
  const kind=e.kind==='run'?'run':'walk',run=kind==='run';
  return {kind,spd:num(e.spd,0,30,0),inc:num(e.inc,0,40,0),ivN:run?int(e.ivN,0,50,0):0,ivW:run?int(e.ivW,0,1800,0):0,ivR:run?int(e.ivR,0,1800,0):0};

const hr=v=>{const n=Number(v);return Number.isFinite(n)&&n>=30&&n<=250?Math.round(n):0;};

/* plan = cardio warm-up (opens) + strength items + cardio cool-down (closes) */
function normPlan(p,exs){
  const g=id=>{const e=exs.find(x=>x.id===id);return e?e.group:null;};
  let items=sanIds(p.items),warm=typeof p.warm==='string'&&ID_RE.test(p.warm)?p.warm:'',cool=typeof p.cool==='string'&&ID_RE.test(p.cool)?p.cool:'';
  if(p.warm===undefined&&p.cool===undefined){const c=items.filter(id=>g(id)==='cardio');if(c.length){warm=c[0];cool=c[c.length-1];}}
  items=items.filter(id=>g(id)&&g(id)!=='cardio');
  if(g(warm)!=='cardio')warm='';if(g(cool)!=='cardio')cool='';

}
const planSeq=p=>p?[p.warm,...p.items,p.cool].filter(Boolean):[];
function sanSet(s){if(!s||typeof s!=='object')return null;return {w:num(s.w,0,1000,0),r:int(s.r,0,200,0),km:num(s.km,0,500,0),min:int(s.min,0,600,0),inc:num(s.inc,0,40,0),spd:num(s.spd,0,30,0),iv:int(s.iv,0,50,0),rpe:int(s.rpe,0,10,0),at:int(s.at,0,9e15,0)};}
function sanLogItem(it){

    sets:(Array.isArray(it.sets)?it.sets:[]).slice(0,10).map(sanSet).filter(Boolean)};
}
function sanLog(l){
  if(!l||typeof l!=='object')return null;

function sanLogs(o){const out={};if(o&&typeof o==='object')for(const k of Object.keys(o)){if(DATE_RE.test(k)){const l=sanLog(o[k]);if(l)out[k]=l;}}return out;}
function sanState(x){
  const s=defState();if(!x||typeof x!=='object')return s;
  const cnt={};
  for(const e of (Array.isArray(x.exercises)?x.exercises:[])){const c=sanEx(e);if(c&&(cnt[c.group]=(cnt[c.group]||0)+1)<=MAX_PER_GROUP&&!s.exercises.some(z=>z.id===c.id))s.exercises.push(c);}
  for(const p of (Array.isArray(x.programs)?x.programs:[]).slice(0,MAX_PROGRAMS)){if(p&&typeof p==='object'&&ID_RE.test(p.id))s.programs.push({id:p.id,name:str(p.name,40).trim()||'תוכנית',...normPlan(p,s.exercises)});}
  if(x.plans&&typeof x.plans==='object')for(const k of Object.keys(x.plans)){const p=x.plans[k];if(DATE_RE.test(k)&&p&&typeof p==='object'){const n=normPlan(p,s.exercises);if(n.warm||n.cool||n.items.length)s.plans[k]={name:str(p.name,40),...n};}}
  s.logs=sanLogs(x.logs);
  const st=x.settings||{};
  s.settings={exRest:int(st.exRest,0,3600,600),allowSkip:st.allowSkip===true,sound:st.sound!==false,vol:int(st.vol,0,100,100),zoom:[100,115,130].includes(st.zoom)?st.zoom:100,age:int(st.age,0,100,0),voice:st.voice!==false,spotify:typeof st.spotify==='string'&&SPOTIFY_RE.test(st.spotify)?st.spotify:'',lastBackup:int(st.lastBackup,0,9e15,0),backupSnooze:int(st.backupSnooze,0,9e15,0),gcid:typeof st.gcid==='string'&&GCID_RE.test(st.gcid)?st.gcid:'',gconn:st.gconn===true};
  const a=x.active;
  if(a&&typeof a==='object'&&DATE_RE.test(a.date)&&['ready','rest','exrest','cardio','cardioend'].includes(a.phase)&&s.logs[a.date])
    s.active={date:a.date,idx:int(a.idx,0,MAX_PLAN_ITEMS-1,0),phase:a.phase,endsAt:int(a.endsAt,0,9e15,0),dur:int(a.dur,0,36000,0),next:Number.isInteger(a.next)&&a.next>=0&&a.next<MAX_PLAN_ITEMS?a.next:null};
  s.body=sanBody(x.body);
  s.updatedAt=int(x.updatedAt,0,9e15,0);
  return s;
}

let db=null, uid=null, cloudOk=false, dirtyCore=false; const dirtyMonths=new Set(); let flushT=null, flushing=false;

function scheduleFlush(){if(!cloudOk)return;clearTimeout(flushT);flushT=setTimeout(flush,1000);}

function monthBody(m){const logs={};for(const k of Object.keys(S.logs))if(k.startsWith(m))logs[k]=S.logs[k];return {month:m,logs};}
async function flush(){
  if(!cloudOk||flushing)return; flushing=true;
  try{
    const col=db.collection('data/users/'+uid);
    while(dirtyCore||dirtyMonths.size){
      if(dirtyCore){dirtyCore=false;await col.doc('core').set(JSON.parse(JSON.stringify(coreBody())));}

/* ============ Google Drive sync (installed app only) ============
   - data file lives in the user's hidden appDataFolder (scope drive.appdata: no access to other Drive files)
   - access token kept in memory only; every remote payload goes through sanState() */
const DRIVE_FILE='gym-data.json',DRIVE_API='https://www.googleapis.com',GIS_SRC='https://accounts.google.com/gsi/client';
const gd={token:null,exp:0,fileId:null,busy:false,again:false,client:null,t:null,last:0};
const driveCapable=()=>!inFrame&&(location.protocol==='https:'||location.hostname==='localhost');

const driveLive=()=>!!gd.token&&Date.now()<gd.exp;
let gisP=null;
function loadGIS(){
  if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return Promise.resolve();
  if(gisP)return gisP;
  gisP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=GIS_SRC;sc.async=true;sc.onload=()=>res();sc.onerror=()=>{gisP=null;rej(new Error('gis'));};document.head.appendChild(sc);setTimeout(()=>rej(new Error('timeout')),15000);});

function cloudChip(){
  const el=$('#sync');if(!el||!driveOK())return;
  el.setAttribute('data-a','cloud-sync');el.setAttribute('role','button');
  if(gd.busy)return;
  el.textContent=driveLive()?'☁️ מסונכרן':'☁️ סנכרן';

function driveConnect(){
  if(!driveOK())return;
  const o=window.google&&window.google.accounts&&window.google.accounts.oauth2;
  if(!o){setSync('⏳ טוען…');loadGIS().then(()=>{cloudChip();toast('מוכן – לחץ שוב על ☁️ סנכרן');}).catch(()=>{setSync('⚠️ אין חיבור');toast('לא ניתן לטעון את Google – בדוק חיבור לאינטרנט');});return;}
  if(!gd.client)gd.client=o.initTokenClient({client_id:S.settings.gcid,scope:'https://www.googleapis.com/auth/drive.appdata',
    callback:r=>{
      if(r&&typeof r.access_token==='string'&&r.access_token.length<4096&&!r.error){
        gd.token=r.access_token;gd.exp=Date.now()+(int(r.expires_in,60,7200,3600)-60)*1000;
        if(!S.settings.gconn){S.settings.gconn=true;lsSave();}
        driveSync(true);
      }else{setSync('⚠️ ההתחברות נכשלה');}
    },
    error_callback:()=>{cloudChip();}});
  gd.client.requestAccessToken({prompt:S.settings.gconn?'':'consent'});

async function dapi(path,opt){
  const o=Object.assign({},opt||{});o.headers=Object.assign({Authorization:'Bearer '+gd.token},o.headers||{});
  const r=await fetch(DRIVE_API+path,o);
  if(r.status===401||r.status===403){gd.token=null;throw new Error('auth');}
  if(!r.ok)throw new Error('http '+r.status);
  return r;
}
const setsOf=l=>l?l.items.reduce((a,i)=>a+i.sets.length,0):0;
function mergeStates(a,b){
  const newer=a.updatedAt>=b.updatedAt?a:b,older=newer===a?b:a;
  const out=sanState(JSON.parse(JSON.stringify(newer)));
  const ol=older.logs||{};
  for(const k of Object.keys(ol)){
    if(!DATE_RE.test(k))continue;
    const mine=out.logs[k],theirs=ol[k];
    if(!mine||setsOf(theirs)>setsOf(mine)||(setsOf(theirs)===setsOf(mine)&&theirs.finishedAt&&!mine.finishedAt))out.logs[k]=theirs;
  }
  const bm=new Map((older.body||[]).map(e=>[e.d,e]));for(const e of out.body)bm.set(e.d,e);out.body=sanBody([...bm.values()]);
  out.settings.gcid=S.settings.gcid;out.settings.gconn=S.settings.gconn;
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return sanState(out);
}
function scheduleDrive(){if(!driveLive())return;clearTimeout(gd.t);gd.t=setTimeout(()=>driveSync(false),4000);}
async function driveSync(manual){
  if(!driveLive()){gd.token=null;cloudChip();if(manual)driveConnect();return;}
  if(gd.busy){gd.again=true;return;}
  gd.busy=true;setSync('⏳ מסנכרן…');
  try{
    if(!gd.fileId){
      const q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
      const j=await (await dapi('/drive/v3/files?spaces=appDataFolder&fields=files(id)&pageSize=10&q='+q)).json();
      const id=j&&Array.isArray(j.files)&&j.files[0]&&j.files[0].id;
      gd.fileId=typeof id==='string'&&/^[A-Za-z0-9_-]{10,200}$/.test(id)?id:null;
    }
    if(gd.fileId){
      const txt=await (await dapi('/drive/v3/files/'+gd.fileId+'?alt=media')).text();
      if(txt.length<=5e6){let x=null;try{x=JSON.parse(txt);}catch(e){}
        if(x){const m=mergeStates(S,sanState(x));if(JSON.stringify(m)!==JSON.stringify(S)){S=m;lsSave();if(S.active)ui.workDate=S.active.date;render();}}}
    }
    const body=JSON.stringify(S);
    if(gd.fileId){
      await dapi('/upload/drive/v3/files/'+gd.fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    }else{
      const fd=new FormData();
      fd.append('metadata',new Blob([JSON.stringify({name:DRIVE_FILE,parents:['appDataFolder'],mimeType:'application/json'})],{type:'application/json'}));
      fd.append('file',new Blob([body],{type:'application/json'}));
      const j=await (await dapi('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:fd})).json();
      gd.fileId=j&&typeof j.id==='string'&&/^[A-Za-z0-9_-]{10,200}$/.test(j.id)?j.id:null;
    }
    gd.last=Date.now();S.settings.lastBackup=gd.last;lsSave();
    if(manual)toast('☁️ הנתונים סונכרנו עם Google Drive');
  }catch(e){
    if(manual)toast(gd.token?'הסנכרון נכשל – נסה שוב':'נדרשת התחברות מחדש לגוגל');
  }finally{
    gd.busy=false;cloudChip();
    if(gd.again){gd.again=false;scheduleDrive();}
  }
}

let actx=null;

/* loud alarm: two-tone square bursts through a compressor (max perceived loudness without clipping) */
let comp=null;
function beep(times){
  const vol=(S.settings.vol??100)/100;
  if(S.settings.sound&&actx&&vol>0){try{
    if(actx.state==='suspended')actx.resume();
    if(!comp){comp=actx.createDynamicsCompressor();comp.threshold.value=-10;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=0.002;comp.release.value=0.1;const mk=actx.createGain();mk.gain.value=2.2;comp.connect(mk);mk.connect(actx.destination);}
    const n=times*2;
    for(let i=0;i<n;i++){
      const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=i%2?2000:1500;o.connect(g);g.connect(comp);
      const t=actx.currentTime+0.05+i*0.22;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol),t+0.01);g.gain.setValueAtTime(Math.max(0.001,vol),t+0.16);g.gain.exponentialRampToValueAtTime(0.0001,t+0.19);o.start(t);o.stop(t+0.2);
    }}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400]);}catch(e){}
}

function backupCard(){

  const now=Date.now(),last=S.settings.lastBackup,since=last||pkey(keys.sort()[0]).getTime();
  if(now-since<7*86400000||now<S.settings.backupSnooze)return '';

/* ---- load balancing ---- */
const STR=GK.filter(g=>g!=='cardio');
const BIG_FIRST=['legs','back','chest','shoulders','arms','abs'];
const addDays=(k,n)=>{const d=pkey(k);d.setDate(d.getDate()+n);return dkey(d);};
function setsByGroup(ids){const r={};for(const id of ids){const e=exById(id);if(e&&!isCardio(e.group))r[e.group]=(r[e.group]||0)+e.sets;}return r;}
function dayLoad(k){
  const l=S.logs[k];
  if(l&&l.items.some(i=>i.sets.length)){const r={};for(const it of l.items)if(!isCardio(it.group)&&it.sets.length)r[it.group]=(r[it.group]||0)+it.sets.length;return r;}
  return S.plans[k]?setsByGroup(S.plans[k].items):{};
}
function weekLoad(k,draft){const start=addDays(k,-pkey(k).getDay()),r={};for(let i=0;i<7;i++){const dk=addDays(start,i),L=dk===k?draft:dayLoad(dk);for(const g of Object.keys(L))r[g]=(r[g]||0)+L[g];}return r;}
function loadBars(L){const tot=Object.values(L).reduce((a,b)=>a+b,0)||1;return STR.filter(g=>L[g]).map(g=>`<div class="hb"><span>${esc(GN[g])}</span><div class="b"><div style="width:${L[g]/tot*100}%"></div></div><span class="v">${L[g]} סט׳ · ${Math.round(L[g]/tot*100)}%</span></div>`).join('');}
function balanceCheck(k,items){
  const day=setsByGroup(items),tot=Object.values(day).reduce((a,b)=>a+b,0),W=[],I=[];
  if(!tot)return {day,tot,W,I,wk:null};
  const gs=Object.keys(day).sort((a,b)=>day[b]-day[a]),share=day[gs[0]]/tot;
  if(share>0.5&&tot>=6)W.push(`${Math.round(share*100)}% מהסטים על ${GN[gs[0]]} – מומלץ לפזר את העומס בין 2–3 קבוצות שריר.`);
  if(tot>30)W.push(`${tot} סטים ביום אחד – נפח גבוה; שקול לפצל לשני ימים.`);
  let wk=null;
  if(k){
    for(const [off,lbl] of [[-1,'ביום הקודם'],[1,'ביום הבא']]){const nb=dayLoad(addDays(k,off)),ov=gs.filter(g=>g!=='abs'&&nb[g]);if(ov.length)W.push(`${ov.map(g=>GN[g]).join(', ')} גם ${lbl} – מומלץ 48 שעות מנוחה לאותה קבוצת שריר.`);}
    wk=weekLoad(k,day);
    const hi=STR.filter(g=>g!=='abs'&&wk[g]>20);if(hi.length)W.push(`נפח שבועי מעל 20 סטים: ${hi.map(g=>GN[g]).join(', ')}.`);
    const miss=STR.filter(g=>!wk[g]&&S.exercises.some(e=>e.group===g));if(miss.length)I.push(`השבוע עדיין לא תוכננו: ${miss.map(g=>GN[g]).join(', ')}.`);
  }
  return {day,tot,W,I,wk};
}
function balanceHtml(ctx){
  const b=balanceCheck(ctx.kind==='plan'?ctx.date:null,ctx.items);
  if(!b.tot)return '<p class="mut" style="margin:6px 0 0">הוסף תרגילי כוח כדי לראות את חלוקת העומס.</p>';
  let h=`<div class="mut" style="margin:6px 0 4px">היום – ${b.tot} סטים</div>${loadBars(b.day)}`;
  if(b.wk)h+=`<div class="mut" style="margin:10px 0 4px">השבוע (א׳–ש׳) כולל אימון זה</div>${loadBars(b.wk)}`;
  h+=b.W.map(t=>`<div style="color:var(--warn);margin-top:6px">⚠️ ${esc(t)}</div>`).join('')+b.I.map(t=>`<div class="mut" style="margin-top:6px">ℹ️ ${esc(t)}</div>`).join('');
  if(!b.W.length)h+=`<div style="color:var(--acc);margin-top:6px">✓ חלוקת העומס מאוזנת</div>`;
  return h;
}
function autoBalance(ctx){
  const k=ctx.date,prev=dayLoad(addDays(k,-1)),next=dayLoad(addDays(k,1)),wk=weekLoad(k,{});
  const has=g=>S.exercises.some(e=>e.group===g);
  const since=g=>{for(let i=1;i<=21;i++)if(dayLoad(addDays(k,-i))[g])return i;return 99;};
  const main=STR.filter(g=>g!=='abs'&&has(g));
  let cand=main.filter(g=>!prev[g]&&!next[g]);
  if(cand.length<2)cand=main.filter(g=>!prev[g]);
  if(cand.length<2)cand=main.slice();
  cand.sort((a,b)=>(wk[a]||0)-(wk[b]||0)||since(b)-since(a));
  const pick=cand.slice(0,3).sort((a,b)=>BIG_FIRST.indexOf(a)-BIG_FIRST.indexOf(b));
  const used={};const from=addDays(k,-30);
  for(const dk of Object.keys(S.logs))if(dk>=from&&dk<k)for(const it of S.logs[dk].items)if(it.sets.length)used[it.exId]=(used[it.exId]||0)+1;
  const per=pick.length>=3?2:3,items=[];
  for(const g of pick){S.exercises.filter(e=>e.group===g).sort((a,b)=>(used[a.id]||0)-(used[b.id]||0)).slice(0,per).forEach(e=>items.push(e.id));}
  for(let guard=0;guard<20;guard++){ /* trim so no group exceeds 50% of sets */
    const L=setsByGroup(items),tot=Object.values(L).reduce((a,b)=>a+b,0),gs=Object.keys(L);
    if(gs.length<2)break;const top=gs.sort((a,b)=>L[b]-L[a])[0];
    if(L[top]/tot<=0.5)break;
    const idxs=items.map((id,i)=>exById(id).group===top?i:-1).filter(i=>i>=0);if(idxs.length<2)break;
    items.splice(idxs[idxs.length-1],1);
  }
  if(has('abs')&&!prev.abs){const a=S.exercises.filter(e=>e.group==='abs').sort((x,y)=>(used[x.id]||0)-(used[y.id]||0))[0];if(a)items.push(a.id);}
  if(!items.length){toast('הוסף תרגילי כוח במאגר כדי לבנות אימון');return;}
  ctx.items=items;
  const fc=firstCardio();if(!ctx.warm)ctx.warm=fc;if(!ctx.cool)ctx.cool=fc;
  const w=$('#warmSel'),c=$('#coolSel');if(w)w.value=ctx.warm;if(c)c.value=ctx.cool;
  refreshItems();toast(`נבנה אימון מאוזן: ${pick.map(g=>GN[g]).join(', ')}`);
}

/* ---- exercises ---- */
function renderEx(){
  let h=`<div class="card"><div class="row"><h2 class="sp" style="margin:0">תוכניות אימון</h2><button class="btn sm pri" data-a="prog-new" ${S.programs.length>=MAX_PROGRAMS?'disabled':''}>➕ תוכנית</button></div>`;
  h+=S.programs.length?S.programs.map(p=>`<div class="li"><span class="nm"><b>${esc(p.name)}</b> <span class="mut">· ${p.items.length} תרגילים</span></span><button class="btn sm" data-a="prog-edit" data-v="${esc(p.id)}">ערוך</button></div>`).join(''):'<p class="mut" style="margin:8px 0 0">תוכנית = רשימת תרגילים קבועה שאפשר לשבץ בימים ביומן.</p>';
  h+='</div>';
  for(const [g,n] of GROUPS){
    const ex=S.exercises.filter(e=>e.group===g);
    h+=`<div class="card"><div class="row"><h2 class="sp" style="margin:0">${esc(n)} <span class="mut">${ex.length}/${MAX_PER_GROUP}</span></h2><button class="btn sm" data-a="ex-new" data-v="${g}" ${ex.length>=MAX_PER_GROUP?'disabled':''}>➕ הוסף</button></div>`;
    h+=ex.map(e=>`<div class="ex"><div class="row"><b class="sp">${esc(e.name)}</b>${e.machine?`<span class="pill">מכשיר ${esc(e.machine)}</span>`:''}<button class="btn sm" data-a="ex-edit" data-v="${esc(e.id)}">ערוך</button></div><div class="mut">${esc(exSummary(e))}</div>${e.notes?`<div class="mut">📝 ${esc(e.notes)}</div>`:''}</div>`).join('');
    h+='</div>';
  }
  return h;
}
function openExEdit(id,group){
  const e=id?exById(id):null;
  const g=e?e.group:group;if(!GK.includes(g))return;
  const c=isCardio(g);
  const v=e||{name:'',sets:c?1:3,w:0,r:10,rest:90,machine:'',notes:'',km:0,min:c?20:0,kind:'walk',spd:0,inc:0,ivN:0,ivW:60,ivR:90};
  openModal(`<div class="mh"><h2>${e?'עריכת':'הוספת'} תרגיל</h2><button class="ico" data-a="close" aria-label="סגור">✕</button></div>
  <form id="exf" autocomplete="off">
  <label for="f-group">קבוצת שריר</label><select id="f-group">${GROUPS.map(([k,n])=>`<option value="${k}" ${k===g?'selected':''}>${esc(n)}</option>`).join('')}</select>
  <label for="f-name">שם התרגיל *</label><input id="f-name" maxlength="60" required value="${esc(v.name)}" placeholder="${c?'הליכון / אופניים':'לחיצת חזה'}">
  <div class="grid3"><div><label for="f-sets">סטים</label><input id="f-sets" type="number" inputmode="numeric" min="1" max="10" value="${v.sets}"></div>
  <div class="cf-s"><label for="f-r">חזרות</label><input id="f-r" type="number" inputmode="numeric" min="0" max="200" value="${v.r}"></div>
  <div class="cf-s"><label for="f-w">משקל (ק״ג)</label><input id="f-w" type="number" inputmode="decimal" step="0.5" min="0" max="1000" value="${v.w}"></div>
  <div class="cf-c"><label for="f-min">זמן (דקות)</label><input id="f-min" type="number" inputmode="numeric" min="0" max="600" value="${v.min}"></div>
  <div class="cf-c"><label for="f-km">ק״מ</label><input id="f-km" type="number" inputmode="decimal" step="0.1" min="0" max="500" value="${v.km}"></div></div>
  <div class="cf-c"><label>סוג</label><div class="row"><label class="pill" style="margin:0;padding:8px 14px;font-size:15px"><input type="radio" name="f-kind" value="walk" style="width:auto" ${v.kind!=='run'?'checked':''}> 🚶 הליכה</label><label class="pill" style="margin:0;padding:8px 14px;font-size:15px"><input type="radio" name="f-kind" value="run" style="width:auto" ${v.kind==='run'?'checked':''}> 🏃 ריצה</label></div>
  <div class="grid2"><div><label for="f-spd">מהירות (קמ״ש)</label><input id="f-spd" type="number" inputmode="decimal" step="0.1" min="0" max="30" value="${v.spd||0}"></div><div><label>מרחק משוער</label><div id="f-est" class="mut" style="padding:10px 0">—</div></div></div>
  <label for="f-inc">זווית שיפוע (%)</label><input id="f-inc" type="number" inputmode="decimal" step="0.5" min="0" max="40" value="${v.inc}">
  <div class="cf-run grid3"><div><label for="f-ivn">אינטרוולים</label><input id="f-ivn" type="number" inputmode="numeric" min="0" max="50" value="${v.ivN}"></div>
  <div><label for="f-ivw">מאמץ (שנ׳)</label><input id="f-ivw" type="number" inputmode="numeric" min="0" max="1800" value="${v.ivW}"></div>
  <div><label for="f-ivr">התאוששות (שנ׳)</label><input id="f-ivr" type="number" inputmode="numeric" min="0" max="1800" value="${v.ivR}"></div></div>
  <p class="mut cf-walk" style="margin:6px 0 0">אינטרוולים זמינים בבחירת ריצה.</p></div>
  <div class="grid2"><div><label for="f-rest">מנוחה בין סטים (שניות)</label> <input id="f-rest" type="number" inputmode="numeric" min="0" max="1800" value="${v.rest}"></div>
  <div><label for="f-machine">מספר מכשיר</label><input id="f-machine" maxlength="20" value="${esc(v.machine)}"></div></div>
  <label for="f-notes">הערות</label><textarea id="f-notes" maxlength="300">${esc(v.notes)}</textarea>
  <div class="actions">${e?'<button type="button" class="btn danger" data-a="ex-del">מחק</button>':''}<button type="button" class="btn" data-a="close">ביטול</button><button type="submit" class="btn pri">שמור</button></div>
  </form>`,{kind:'ex',id:e?e.id:null});
  toggleCardioFields();
}
const fKind=()=>{const r=document.querySelector('input[name=f-kind]:checked');return r&&r.value==='run'?'run':'walk';};
function estDist(){const el=$('#f-est');if(!el)return;const sp=num($('#f-spd').value,0,30,0),mn=num($('#f-min').value,0,600,0);el.textContent=sp&&mn?`${fmtN(sp*mn/60,2)} ק״מ (${fmtN(sp,1)} קמ״ש × ${mn} דק׳)`:'—';}
function toggleCardioFields(){estDist();const g=$('#f-group');if(!g)return;const c=isCardio(g.value),run=fKind()==='run';
  document.querySelectorAll('.cf-s').forEach(x=>x.style.display=c?'none':'');document.querySelectorAll('.cf-c').forEach(x=>x.style.display=c?'':'none');
  document.querySelectorAll('.cf-run').forEach(x=>x.style.display=run?'':'none');document.querySelectorAll('.cf-walk').forEach(x=>x.style.display=run?'none':'');}
function saveEx(){
  const c=modalCtx;const g=$('#f-group').value;
  if(!GK.includes(g))return;
  const name=str($('#f-name').value,60).trim();if(!name){toast('יש להזין שם תרגיל');return;}
  const count=S.exercises.filter(e=>e.group===g&&e.id!==c.id).length;
  if(count>=MAX_PER_GROUP){toast(`בקבוצה "${GN[g]}" כבר יש ${MAX_PER_GROUP} תרגילים`);return;}
  const e=sanEx({id:c.id||newId(),group:g,name,sets:$('#f-sets').value,w:$('#f-w').value,r:$('#f-r').value,rest:$('#f-rest').value,machine:$('#f-machine').value,notes:$('#f-notes').value,km:$('#f-km').value,min:$('#f-min').value,
    kind:fKind(),spd:$('#f-spd').value,inc:$('#f-inc').value,ivN:$('#f-ivn').value,ivW:$('#f-ivw').value,ivR:$('#f-ivr').value});
  if(!e)return;
  const i=S.exercises.findIndex(x=>x.id===e.id);
  if(i>=0)S.exercises[i]=e;else S.exercises.push(e);
  commit();closeModal();render();toast('התרגיל נשמר');
}

/* ---- workout ---- */
function buildLog(k){
  const p=S.plans[k];if(!p)return null;
  const seq=[];if(p.warm)seq.push([p.warm,'warm']);p.items.forEach(id=>seq.push([id,'']));if(p.cool)seq.push([p.cool,'cool']);
  const items=seq.map(([id,role])=>[exById(id),role]).filter(x=>x[0]).map(([e,role])=>({role,exId:e.id,name:e.name,group:e.group,machine:e.machine,notes:e.notes,rest:e.rest,t:{sets:e.sets,w:e.w,r:e.r,km:e.km,min:e.min,kind:e.kind,spd:e.spd,inc:e.inc,ivN:e.ivN,ivW:e.ivW,ivR:e.ivR},hrB:0,hrA:0,sets:[]}));
  return items.length?{items,startedAt:Date.now(),finishedAt:0}:null;
}
function startWorkout(k){
  if(!DATE_RE.test(k))return;
  let l=S.logs[k];
  if(!l){l=buildLog(k);if(!l){toast('אין תרגילים תקפים בתכנון');return;}S.logs[k]=l;}
  if(!l.finishedAt&&(!S.active||S.active.date!==k)){
    const idx=l.items.findIndex(i=>i.sets.length<i.t.sets);
    S.active={date:k,idx:idx<0?0:idx,phase:'ready',endsAt:0,dur:0};
  }
  ui.workDate=k;ui.tab='work';commit(k);closeModal();render();
}
function curDraft(i){const g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};return {w:g('in-w-'+i),r:g('in-r-'+i),km:g('in-km-'+i),min:g('in-min-'+i),inc:g('in-inc-'+i),spd:g('in-spd-'+i),iv:g('in-iv-'+i),rpe:g('in-rpe-'+i)};}
function savePulse(el){
  const k=el.dataset.d,i=int(el.dataset.i,0,MAX_PLAN_ITEMS,0),w=el.dataset.hr;
  const l=DATE_RE.test(k)&&S.logs[k];if(!l||!l.items[i]||!isCardio(l.items[i].group)||(w!=='b'&&w!=='a'))return;
  const v=hr(el.value);
  if(el.value!==''&&!v){toast('דופק לא תקין (30–250)');el.value=l.items[i][w==='b'?'hrB':'hrA']||'';return;}
  l.items[i][w==='b'?'hrB':'hrA']=v;commit(k);toast('הדופק נשמר');if(ui.tab==='day')setTimeout(render,0);
}
function saveKm(el){
  const k=el.dataset.d,i=int(el.dataset.i,0,MAX_PLAN_ITEMS,0),si=int(el.dataset.s,0,10,0);
  const l=DATE_RE.test(k)&&S.logs[k],it=l&&l.items[i],rec=it&&isCardio(it.group)&&it.sets[si];if(!rec)return;
  const v=Number(el.value);if(el.value===''||!Number.isFinite(v)||v<0||v>500){toast('מרחק לא תקין (0–500 ק״מ)');el.value=rec.km;return;}
  rec.km=Math.round(v*100)/100;commit(k);toast('המרחק נשמר');
}
/* cardio: countdown of the planned time; finishing is confirmed only when it reaches 0 */
const needsCardioTimer=it=>isCardio(it.group)&&it.t.min>0;
function cardioStart(){
  const a=S.active;if(!a||a.phase!=='ready')return;
  const l=S.logs[a.date],it=l&&l.items[a.idx];if(!it||!needsCardioTimer(it))return;
  unlockAudio();
  const el=document.getElementById('in-min-'+it.sets.length),mn=el?num(el.value,0,600,it.t.min):it.t.min;
  const hb=document.getElementById('hr-b-'+a.idx);if(hb&&hb.value&&!it.hrB)it.hrB=hr(hb.value);
  a.phase='cardio';a.dur=Math.round(mn*60);a.endsAt=Date.now()+a.dur*1000;
  say(`${KW[it.t.kind]||'אימון'} התחילה. ${Math.round(mn)} דקות`);
  commit(a.date);if(!advance(false))render();else render();
}
function markSet(){
  const a=S.active;if(!a)return;
  const l=S.logs[a.date];if(!l)return;const it=l.items[a.idx];if(!it||it.sets.length>=it.t.sets)return;
  const ok=a.phase==='cardioend'||(a.phase==='ready'&&!needsCardioTimer(it));
  if(!ok)return;
  const lastOfAll=it.sets.length+1>=it.t.sets&&l.items.every((x,j)=>j===a.idx||itDone(x));
  takeUndo(lastOfAll?'האימון הושלם':isCardio(it.group)?`${it.name} – סיום אושר`:`סט ${it.sets.length+1} סומן – ${it.name}`);
  unlockAudio();
  const d=curDraft(it.sets.length);
  const s=sanSet({w:d.w??it.t.w,r:d.r??it.t.r,km:d.km??it.t.km,min:d.min??it.t.min,inc:d.inc??it.t.inc,spd:d.spd??it.t.spd,iv:d.iv??it.t.ivN,rpe:d.rpe??0,at:Date.now()});
  const hb=document.getElementById('hr-b-'+a.idx);if(isCardio(it.group)&&hb&&hb.value&&!it.hrB)it.hrB=hr(hb.value);
  it.sets.push(s);
  if(it.sets.length<it.t.sets){a.phase='rest';a.dur=it.rest;a.endsAt=Date.now()+it.rest*1000;}
  else if(nextTarget(l,a)>=0){a.phase='exrest';a.dur=S.settings.exRest;a.endsAt=Date.now()+S.settings.exRest*1000;}
  else{finishWorkout(true);return;}
  commit(a.date);render();
}
/* free navigation between exercises: rest timings unchanged, a switch requested during a rest is applied when it ends */
const itDone=it=>it.sets.length>=it.t.sets;
function nextPending(l,from){const n=l.items.length;for(let s=1;s<n;s++){const j=(from+s)%n;if(!itDone(l.items[j]))return j;}return -1;}
function nextTarget(l,a){return a.next!=null&&a.next!==a.idx&&l.items[a.next]&&!itDone(l.items[a.next])?a.next:nextPending(l,a.idx);}
function goEx(i){
  const a=S.active,l=a&&S.logs[a.date];if(!l||!l.items[i]||itDone(l.items[i])||i===a.idx&&a.phase==='ready')return;
  if(a.phase==='cardio'||a.phase==='cardioend'){toast('סיים ואשר קודם את תרגיל האירובי');return;}
  if(a.phase==='rest'||a.phase==='exrest'){
    a.next=a.next===i?null:i;commit(a.date);render();
    toast(a.next===i?`⏭ בסיום המנוחה ייפתח: ${l.items[i].name}`:'הבחירה בוטלה');return;
  }
  const cur=l.items[a.idx];if(cur&&!itDone(cur))cur.skipped=true;
  a.idx=i;a.next=null;commit(a.date);render();say(`עברת ל${l.items[i].name}`);toast(`⏭ עברת ל: ${l.items[i].name}`);
}
/* one-level undo for the last mark / finish (10 seconds) */
let undoSnap=null,undoT=null;
function takeUndo(label){
  const a=S.active;if(!a)return;
  undoSnap={date:a.date,active:JSON.parse(JSON.stringify(a)),log:JSON.parse(JSON.stringify(S.logs[a.date])),at:Date.now()};
  $('#undo-t').textContent='✓ '+label;$('#undo').classList.add('show');
  clearTimeout(undoT);undoT=setTimeout(hideUndo,10000);
}
function hideUndo(){$('#undo').classList.remove('show');undoSnap=null;clearTimeout(undoT);}
function doUndo(){
  const u=undoSnap;hideUndo();
  if(!u||Date.now()-u.at>10500)return;
  const lg=sanLog(u.log);if(!lg)return;
  S.logs[u.date]=lg;S.active=u.active;
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  ui.workDate=u.date;ui.tab='work';commit(u.date);render();toast('↶ הסימון בוטל');
}
/* history & progressive overload */
const sameEx=(x,it)=>(it.exId&&x.exId===it.exId)||(x.name===it.name&&x.group===it.group);
function histFor(it,before){
  const out=[];
  for(const k of Object.keys(S.logs).sort().reverse()){
    if(k>=before)continue;const m=S.logs[k].items.find(x=>sameEx(x,it)&&x.sets.length);
    if(m){out.push({date:k,it:m});if(out.length>=2)break;}
  }
  return out;
}
const shortD=k=>{const [y,m,d]=k.split('-');return `${+d}.${+m}`;};
function lastText(m){
  if(isCardio(m.group)){const x=m.sets[m.sets.length-1];return cardioDesc({kind:m.t.kind,min:x.min,km:x.km,spd:x.spd,inc:x.inc,ivN:x.iv,ivW:m.t.ivW,ivR:m.t.ivR},1);}
  const ws=m.sets.map(x=>x.w);
  return ws.every(w=>w===ws[0])?`${m.sets.length} סטים × ${m.sets.map(x=>x.r).join('/')} חזרות · ${fmtN(ws[0],1)} ק״ג`:m.sets.map(x=>`${fmtN(x.w,1)}×${x.r}`).join(' , ');
}
function suggestFor(it,before){
  const h=histFor(it,before);if(h.length<2)return null;
  const full=x=>x.it.sets.length>=x.it.t.sets&&x.it.sets.every(s=>isCardio(x.it.group)?s.min>=x.it.t.min:s.r>=x.it.t.r);
  if(!full(h[0])||!full(h[1]))return null;
  if(isCardio(it.group)){
    const sp=Math.max(...h[0].it.sets.map(x=>x.spd)),sp1=Math.max(...h[1].it.sets.map(x=>x.spd));
    if(!sp||sp!==sp1||it.t.spd>sp)return null;
    return {kind:'spd',v:Math.min(30,Math.round((sp+0.5)*10)/10),from:sp};
  }
  const w0=Math.max(...h[0].it.sets.map(x=>x.w)),w1=Math.max(...h[1].it.sets.map(x=>x.w));
  if(!w0||w0!==w1||it.t.w>w0)return null;
  const hiR=Math.max(0,...h[0].it.sets.map(x=>x.rpe||0));
  if(hiR>=9)return {kind:'hold',rpe:hiR,from:w0};
  const step=['legs','back'].includes(it.group)?5:2.5;
  return {kind:'w',v:Math.min(1000,w0+step),from:w0,step};
}
function applySug(i){
  const a=S.active,l=a&&S.logs[a.date],it=l&&l.items[i];if(!it||it.sets.length)return;
  const sg=suggestFor(it,a.date);if(!sg)return;
  const e=exById(it.exId);
  if(sg.kind==='w'){it.t.w=sg.v;if(e)e.w=sg.v;}else{it.t.spd=sg.v;if(e)e.spd=sg.v;}
  commit(a.date);render();toast(sg.kind==='w'?`📈 המשקל עודכן ל־${fmtN(sg.v,1)} ק״ג`:`📈 המהירות עודכנה ל־${fmtN(sg.v,1)} קמ״ש`);
}
function finishWorkout(auto){
  const a=S.active;if(!a)return;const l=S.logs[a.date];
  if(l)l.finishedAt=Date.now();
  const k=a.date;S.active=null;commit(k);render();
  ui.workDate=k;ui.dayK=k;ui.tab='day';render();
  if(auto){beep(3);toast('🎉 האימון הושלם! זה הסיכום היומי');setTimeout(()=>say('כל הכבוד! האימון הושלם.'),1200);}
}
function advance(silent){
  const a=S.active;if(!a)return false;
  if(a.phase==='cardio'&&Date.now()>=a.endsAt){
    a.phase='cardioend';commit(a.date);if(!silent){beep(3);toast('⏱ הזמן הסתיים – אשר את סיום התרגיל');const it=S.logs[a.date]&&S.logs[a.date].items[a.idx];say(`הזמן הסתיים. אשר את סיום ה${it?KW[it.t.kind]||'תרגיל':'תרגיל'}`);}return true;
  }
  if((a.phase==='rest'||a.phase==='exrest')&&Date.now()>=a.endsAt){
    const l=S.logs[a.date];
    if(a.phase==='exrest'&&l){const nx=nextTarget(l,a);if(nx>=0)a.idx=nx;a.next=null;}
    else if(a.phase==='rest'&&l&&a.next!=null&&a.next!==a.idx&&l.items[a.next]&&!itDone(l.items[a.next])){const cur=l.items[a.idx];if(cur&&!itDone(cur))cur.skipped=true;a.idx=a.next;a.next=null;}
    a.phase='ready';a.endsAt=0;
    commit(a.date);
    if(!silent){beep(2);setTimeout(()=>sayNext(a),900);}
    return true;
  }
  return false;
}
/* change rest length during a running rest; countdown keeps its start point */
const TIMED=['rest','exrest','cardio'];
function setRest(sec,keep){
  const a=S.active;if(!a||!TIMED.includes(a.phase))return;
  const start=a.endsAt-a.dur*1000;a.dur=sec;a.endsAt=start+sec*1000;
  const it=S.logs[a.date]&&S.logs[a.date].items[a.idx];
  if(keep){if(a.phase==='rest'){if(it)it.rest=sec;}else if(a.phase==='exrest')S.settings.exRest=sec;else if(it)it.t.min=Math.round(sec/60);}
  commit(a.date);advance(false);render();toast(`${a.phase==='cardio'?'זמן התרגיל':'המנוחה'} עודכן ל־${mmss(sec)}`);
}
function setItemRest(i,sec){
  const a=S.active,l=a&&S.logs[a.date],it=l&&l.items[i];if(!it)return;
  it.rest=sec;
  if(a.phase==='rest'&&a.idx===i)setRest(sec,false);else{commit(a.date);render();toast(`מנוחה בין סטים: ${mmss(sec)}`);}
}
function setExRest(sec){
  S.settings.exRest=sec;const a=S.active;
  if(a&&a.phase==='exrest')setRest(sec,false);else{commit(a&&a.date);render();toast(`מנוחה בין תרגילים: ${mmss(sec)}`);}
}
function openRestTimes(){

/* small SVG line chart: one measure per chart (no dual axis), 2px lines, ringed markers, tap/hover tooltip, table view */
const SERIES=['#3b8de0','#c98314'];
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function lineChart(id,labels,series,unit,dec){
  const vals=series.flatMap(x=>x.vals.filter(v=>v!=null));
  if(vals.length<2)return '<p class="mut">נדרשים לפחות שני אימונים עם נתון זה.</p>';
  const W=340,H=170,L=40,R=34,T=12,B=24,n=labels.length;
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1;}
  const st=niceStep((hi-lo)/3);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(lo<0&&Math.min(...vals)>=0)lo=0;
  const X=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--mut)">${fmtN(v,dec)}</text>`;
  const xl=[0,n-1];if(n>4)xl.splice(1,0,Math.floor((n-1)/2));
  for(const i of [...new Set(xl)])g+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(labels[i])}</text>`;
  series.forEach((sr,si)=>{
    const col=SERIES[si],pts=sr.vals.map((v,i)=>v==null?null:[X(i),Y(v),v,i]).filter(Boolean);
    if(pts.length>1)g+=`<path d="${pts.map((q,j)=>(j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    for(const q of pts){const tip=`${labels[q[3]]} · ${sr.name}: ${fmtN(q[2],dec)}${unit}`;
      g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="${col}" stroke="var(--panel)" stroke-width="2"/><circle class="hit" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="12" fill="transparent" data-a="tip" data-c="${id}" data-v="${esc(tip)}"><title>${esc(tip)}</title></circle>`;}
    const last=pts[pts.length-1];if(last)g+=`<text x="${(last[0]+7).toFixed(1)}" y="${(last[1]+3.5).toFixed(1)}" font-size="11" fill="var(--txt)">${fmtN(last[2],dec)}</text>`;
  });
  const legend=series.length>1?`<div class="lg">${series.map((sr,si)=>`<span><i style="background:${SERIES[si]}"></i>${esc(sr.name)}</span>`).join('')}</div>`:'';
  const table=`<details class="tbl"><summary>הצג כטבלה</summary><table><thead><tr><th>אימון</th>${series.map(sr=>`<th class="n">${esc(sr.name)}</th>`).join('')}</tr></thead><tbody>${labels.map((lb,i)=>`<tr><td>${esc(lb)}</td>${series.map(sr=>`<td class="n">${sr.vals[i]==null?'—':fmtN(sr.vals[i],dec)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  return `${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(x=>x.name).join(', '))}">${g}</svg><div class="tip" id="tip-${id}" aria-live="polite"></div>${table}`;
}

/* ---- summary ---- */
function monthStats(prefix){
  const r={workouts:0,completed:0,sets:0,kg:0,km:0,cmin:0,walkKm:0,runKm:0,planned:0,byG:{},byEx:{}};
  for(const k of Object.keys(S.plans))if(k.startsWith(prefix))r.planned++;
  for(const k of Object.keys(S.logs)){
    if(!k.startsWith(prefix))continue;const l=S.logs[k];
    const any=l.items.some(i=>i.sets.length);if(!any)continue;
    r.workouts++;if(isComplete(l))r.completed++;
    for(const it of l.items){
      const key=it.group+'|'+it.name;const e=r.byEx[key]||(r.byEx[key]={name:it.name,group:it.group,sets:0,kg:0,max:0,km:0});
      for(const s of it.sets){
        r.sets++;e.sets++;
        if(isCardio(it.group)){r.km+=s.km;r.cmin+=s.min;e.km+=s.km;if(it.t.kind==='run')r.runKm+=s.km;else r.walkKm+=s.km;}
        else{const v=s.w*s.r;r.kg+=v;e.kg+=v;e.max=Math.max(e.max,s.w);r.byG[it.group]=(r.byG[it.group]||0)+v;}
      }
    }
  }
  return r;
}
/* ---- heart-rate analysis ---- */
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function pulseStats(prefix){
  const start=[],cardioAfter=[],rise=[],pace=[];let cardioSessions=0,cardioMin=0;
  for(const k of Object.keys(S.logs)){
    if(!k.startsWith(prefix))continue;const l=S.logs[k];
    if(!l.items.some(i=>i.sets.length))continue;
    const first=l.items.find(i=>isCardio(i.group)&&i.hrB);if(first)start.push(first.hrB);
    let hadCardio=false;
    for(const it of l.items){
      if(isCardio(it.group)&&it.hrB&&it.hrA)rise.push(it.hrA-it.hrB);
      if(isCardio(it.group)&&it.sets.length){
        hadCardio=true;const km=it.sets.reduce((x,s)=>x+s.km,0),mn=it.sets.reduce((x,s)=>x+s.min,0);cardioMin+=mn;
        if(it.hrA)cardioAfter.push(it.hrA);
        if(km>0&&mn>0)pace.push(km/(mn/60));
      }
    }
    if(hadCardio)cardioSessions++;
  }
  return {start:avg(start),after:avg(cardioAfter),rise:avg(rise),pace:avg(pace),n:start.length+cardioAfter.length+rise.length,cardioSessions,cardioMin};
}
function prevPrefix(y,m){m--;if(m<0){m=11;y--;}return {y,m,p:y+'-'+pad(m+1)};}
function trendCell(cur,prev,lowerIsBetter,th){
  if(cur==null)return '<td class="n mut">—</td><td></td>';
  if(prev==null)return `<td class="n">${fmtN(cur,1)}</td><td class="mut">אין השוואה</td>`;
  const d=cur-prev,good=lowerIsBetter?d<=-th:d>=th,bad=lowerIsBetter?d>=th:d<=-th;
  return `<td class="n">${fmtN(cur,1)}</td><td style="color:${good?'var(--acc)':bad?'var(--bad)':'var(--mut)'}">${good?'▲ שיפור':bad?'▼ נסיגה':'● יציב'} <span class="mut">(${d>0?'+':''}${fmtN(d,1)})</span></td>`;
}
function pulseRecs(c,p){
  const R=[],age=S.settings.age,max=age?220-age:0;
  if(!c.n){R.push('לא הוזנו מדידות דופק החודש. הזן דופק לפני ואחרי תרגילי סיבולת לב ריאה (אירובי הפתיחה והסיום) כדי לקבל השוואה.');return R;}
  if(c.start!=null&&p.start!=null){
    if(c.start-p.start<=-2)R.push(`דופק ההתחלה ירד ב־${fmtN(p.start-c.start,1)} פעימות לעומת החודש הקודם – סימן טוב לשיפור הכושר האירובי. המשך בעקביות.`);
    else if(c.start-p.start>=2)R.push(`דופק ההתחלה עלה ב־${fmtN(c.start-p.start,1)} פעימות. ייתכן עייפות, שינה לא מספקת, לחץ, קפאין או התייבשות – שקול יום מנוחה נוסף ומדוד תמיד באותם תנאים (אחרי 2–3 דקות ישיבה).`);
    else R.push('דופק ההתחלה יציב לעומת החודש הקודם.');
  }
  if(c.after!=null&&p.after!=null){
    const dp=(c.pace!=null&&p.pace!=null)?(c.pace-p.pace)/p.pace:0,da=c.after-p.after;
    if((da<=-3&&dp>=-0.05)||(dp>=0.05&&da<3))R.push('באירובי אתה עובד באותו קצב או מהר יותר עם דופק נמוך יותר – שיפור בסיבולת. אפשר להעלות בהדרגה (כ־5–10%) את השיפוע, המהירות או מספר האינטרוולים.');
    else if(da>=3&&dp<=0.02)R.push('הדופק אחרי האירובי עלה בלי עלייה בקצב. כדאי לבדוק התאוששות ושינה, ולהוריד מעט עצימות לשבוע–שבועיים.');
  }
  if(max&&c.after!=null){
    const pct=c.after/max*100;
    if(pct>90)R.push(`הדופק הממוצע בסיום אירובי הוא כ־${fmtN(pct)}% מהדופק המרבי המשוער (${max}) – עצימות גבוהה מאוד. שלב יותר אימונים בעצימות בינונית (60–80%).`);
    else if(pct<60)R.push(`הדופק בסיום אירובי הוא כ־${fmtN(pct)}% מהמרבי המשוער – עצימות נמוכה. לשיפור סיבולת כוון ל־60–80% (${Math.round(max*0.6)}–${Math.round(max*0.8)} פעימות).`);
    else if(pct>80)R.push(`הדופק בסיום אירובי הוא כ־${fmtN(pct)}% מהמרבי המשוער – עצימות גבוהה. מתאים לאינטרוולים, אבל רוב האימונים כדאי לבצע ב־60–80% (${Math.round(max*0.6)}–${Math.round(max*0.8)} פעימות).`);
    else R.push(`העצימות באירובי בטווח המומלץ לשיפור סיבולת (${fmtN(pct)}% מהדופק המרבי המשוער).`);
  }else if(!max&&c.after!=null)R.push('הזן גיל בהגדרות ⚙️ כדי לקבל הערכה של אזור הדופק באירובי.');
  if(c.start!=null&&c.start>100)R.push('דופק לפני אימון מעל 100 באופן קבוע – מומלץ להתייעץ עם רופא.');
  if(c.cardioMin<600)R.push(`החודש בוצעו ${c.cardioMin} דקות אירובי. ההמלצה המקובלת היא כ־150 דקות בשבוע בעצימות בינונית (כ־600 בחודש).`);
  return R;
}

let wl=null;
async function wakeLock(){
  try{
    const want=!!S.active&&!document.hidden;
    if(want&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}
    else if(!want&&wl){await wl.release();wl=null;}
  }catch(e){wl=null;}

let swReg=null,lastUpd=0;
function checkUpdate(manual){
  if(!swReg){if(manual)toast('בדיקת עדכונים זמינה באפליקציה המותקנת');return;}
  lastUpd=Date.now();
  swReg.update().then(()=>{
    if(!manual)return;
    setTimeout(()=>{const w=swReg.waiting||swReg.installing;toast(w?'⬇️ נמצאה גרסה חדשה – לחץ "רענן" בפס הכחול':`✓ יש לך את הגרסה האחרונה (${APP_VERSION})`);if(w&&swReg.waiting)$('#upd').classList.add('show');},1500);
  }).catch(()=>{if(manual)toast('אין חיבור לאינטרנט – נסה שוב מאוחר יותר');});
}
function initPWA(){
  if(inFrame||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  try{
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastUpd>60000)checkUpdate(false);});
    setInterval(()=>{if(!document.hidden)checkUpdate(false);},30*60000);
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{swReg=reg;lastUpd=Date.now();
      if(reg.waiting&&navigator.serviceWorker.controller)$('#upd').classList.add('show');
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)$('#upd').classList.add('show');});});
    }).catch(()=>{});
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){}
}

  if(t.id==='f-spd'||t.id==='f-min'||t.id==='f-km')estDist();
  if(t.id==='s-vol'){const v=$('#s-vol-v');if(v)v.textContent=int(t.value,0,100,100)+'%';}
  if(t.dataset&&t.dataset.rt){const a=S.active;if(!a)return;const keep=$('#rest-keep')&&$('#rest-keep').checked;
    const sec=a.phase==='rest'?int(t.value,0,1800,a.dur):Math.round(num(t.value,0,a.phase==='cardio'?600:60,a.dur/60)*60);setRest(sec,keep);}
  if(t.dataset&&t.dataset.er){if(!S.active)return;setExRest(Math.round(num(t.value,0,60,S.settings.exRest/60)*60));}
  if(t.dataset&&t.dataset.ir){if(!S.active)return;const i=int(t.dataset.i,0,MAX_PLAN_ITEMS,-1);if(i<0)return;setItemRest(i,int(t.value,0,1800,90));}
  if(t.dataset&&t.dataset.cs&&modalCtx&&(t.dataset.cs==='warm'||t.dataset.cs==='cool')){const e=exById(t.value);modalCtx[t.dataset.cs]=e&&isCardio(e.group)?e.id:'';refreshItems();}
});
$('#bkfile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  if(f.size>5e6){toast('הקובץ גדול מדי');return;}
  f.text().then(txt=>{let x;try{x=JSON.parse(txt);}catch(e){toast('קובץ גיבוי לא תקין');return;}
    confirmBox('לשחזר מהקובץ? הנתונים הנוכחיים יוחלפו.','שחזר',()=>{S=sanState(x);dirtyCore=true;for(const k of Object.keys(S.logs))dirtyMonths.add(k.slice(0,7));commit();render();toast('הנתונים שוחזרו מהקובץ');});
  }).catch(()=>toast('לא ניתן לקרוא את הקובץ'));
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#ov').classList.contains('show'))closeModal();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer();wakeLock();});
setInterval(updateTimer,250);

/* ============ boot ============ */
S=sanState(lsLoad());
if(S.active){ui.workDate=S.active.date;ui.tab='work';}
if(S.active&&(S.active.phase==='rest'||S.active.phase==='exrest')&&Date.now()>=S.active.endsAt)advance(true);
render();
initCloud();
initPWA();
if(driveOK()){cloudChip();loadGIS().catch(()=>{});}
if(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')window.__gym={get S(){return S;},ui,sanState,esc}; /* test hook: local only */
})();
</script>
